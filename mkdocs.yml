site_name: dsprofile

repo_url: https://github.com/CA4EOSC/dsprofile
repo_name: CA4EOSC/dsprofile

theme:
  name: "material"
  palette:
    - scheme: default
      primary: indigo
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Switch to dark mode

    - scheme: slate
      primary: indigo
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Switch to light mode

  features:
    - navigation.indices
    - navigation.indexes
    #- navigation.sections
    - navigation.footer
    - navigation.top
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.tracking

extra_css:
  - stylesheets/extra.css

plugins:
  - mkdocstrings
  - autorefs:
      resolve_closest: true
  - git-revision-date-localized:
      enable_creation_date: false
      type: datetime
      fallback_to_build_date: true

markdown_extensions:
  - attr_list
  - admonition
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences

nav:
  - Overview: 
    - index.md
    - Installation: install.md
    - Command-line Reference: cli.md
    - Context Attributes: context-attributes.md
    - Examples:
      - examples/index.md
      - Advanced Installation: examples/advanced-install.md
      - Configuring Output: examples/output-config.md
  - Extending:
    - extending/index.md
    - Adding a Reader: extending/reader.md
  - API Reference:
    - reference/index.md
    - The Reader class: reference/reader.md
    - Utilities: reference/utils.md
