name: mkdocs-to-gh-pages
on:
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout workflow trigger ref
        uses: actions/checkout@v6

      - name: Configure Git Credentials
        run: |
          git config --local user.name ${{ secrets.PAGES_USER }}
          git config --local user.email ${{ secrets.PAGES_EMAIL }}

      - name: Install Python
        uses: actions/setup-python@v6
        with:
          python-version: 3.x

      - name: Install mkdocs and plugins
        run: |
          python -m pip install --upgrade pip
          python -m pip install mkdocs
          python -m pip install mkdocs-autorefs
          python -m pip install mkdocs-material
          python -m pip install mkdocs-git-revision-date-localized-plugin
          python -m pip install mkdocstrings[python]

      - name: Build and push docs
        run: mkdocs gh-deploy --force
